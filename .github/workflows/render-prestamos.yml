name: Render préstamos

on:
  workflow_dispatch:
  push:
    paths:
      - "video/prestamos/**"
      - ".github/workflows/render-prestamos.yml"

permissions:
  contents: read

jobs:
  render:
    name: Render 60s · 1440x900 · 30fps
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # HyperFrames 0.9.59 declares engines.node >=22.
      # Node 20 is not supported by the CLI.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/prestamos/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: video/prestamos
        run: npm ci

      - name: Verify audio assets
        # La narración y la música están versionadas; falla si falta la voz
        # o si la pista no cubre el tramo 3–58 s.
        run: |
          set -euo pipefail
          for ASSET in bgm.mp3 narracion.mp3 click.wav success.wav; do
            test -s "video/prestamos/assets/$ASSET"
          done
          test -s video/prestamos/guion.txt
          DURATION="$(ffprobe -v error -show_entries format=duration \
            -of csv=p=0 video/prestamos/assets/narracion.mp3)"
          echo "Narración: ${DURATION}s"
          awk -v d="$DURATION" 'BEGIN { exit !(d >= 54 && d <= 56) }'

      - name: Lint composition
        working-directory: video/prestamos
        run: npm run lint

      - name: Render video
        working-directory: video/prestamos
        # SwiftShader keeps CI deterministic on runners without a GPU.
        # Two workers keep the 1800-frame capture inside the 30-minute job limit.
        # HyperFrames mixes the <audio> clips automatically: there is no --audio
        # flag, and its Chromium already enables autoplay without a user gesture.
        run: npm run render -- --no-browser-gpu --workers 2

      - name: Verify audio stream
        # Falla el job si el MP4 sale mudo. El render debe contener AAC estéreo.
        run: |
          set -euo pipefail
          test -f out/prestamos.mp4
          AUDIO_STREAMS="$(ffprobe -v error -select_streams a \
            -show_entries stream=codec_name -of csv=p=0 out/prestamos.mp4)"
          echo "Audio streams: ${AUDIO_STREAMS}"
          echo "${AUDIO_STREAMS}" | grep -qx "aac"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-prestamos
          path: out/prestamos.mp4
          if-no-files-found: error
          retention-days: 30
